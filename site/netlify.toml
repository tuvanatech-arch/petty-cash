# usepetti.com – Petti's public page (the app itself is the petti-app project at app.usepetti.com).
# Plain files, no build step. Enquiries arrive through Netlify Forms (form "enquiry").
[build]
  publish = "."
  command = ""
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
