<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Petty Cash &amp; Stock</title>
  <meta name="description" content="Petty cash requests, approvals, receipts and stock, in one cash book.">
  <meta name="theme-color" content="#1b5e4b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b5e4b'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='17' font-weight='700' text-anchor='middle' fill='white'%3EN$%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Petty Cash">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><div class="auth"><div class="loading" id="boot">Loading…</div></div></div>
  <script>
    // if the app itself has not drawn within 12 s (file blocked, script error), offer a way out instead of a dead screen
    setTimeout(function () {
      var b = document.getElementById('boot'); if (!b || !b.isConnected) return;
      b.innerHTML = 'Still loading… <br><br><button onclick="location.reload(true)" style="font:inherit;padding:10px 16px;border-radius:6px;border:1px solid #888;background:transparent;color:inherit">Reload</button>'
        + '<p style="font-size:.85rem;opacity:.7;margin-top:14px">If this keeps happening, open the link in your browser once, then try the app icon again.</p>';
    }, 12000);
  </script>
  <div id="toast-root"></div>
  <div id="modal-root"></div>
  <div id="tip" class="tip"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
